# 错题本 DSH 插件 · cordis patch
#
# 两条预设：复习（study loop）与答疑（就地问答）。preset 的 plugins 行就是它的
# 身份与工具面——没有单独的工具/提示词字段，删行才是配置层的保证。
#
# 安装方式（二选一）：
#   1. 作为 Bundle 安装本包后，把下面整段合并进 profile 的 cordis.patch.yml；
#   2. 直接把本文件的 insert 列表追加进 profile 的 cordis.patch.yml。
# 下面的 <REPO> 是仓库根目录的占位符，安装前替换成你自己的绝对路径：
#   PowerShell:  (Get-Content cordis.patch.yml) -replace '<REPO>', $PWD.Path | Set-Content cordis.patch.yml
#   bash:        sed -i "s#<REPO>#$PWD#g" cordis.patch.yml
# 必须用绝对路径：DSH 会话的工作目录是任意的，相对路径在别处解析不出来。

# 根行（面板）：宿主只从**根 loader 行**发现 dsh.client，且行名必须是**裸包名**——
# dsh-client-modules 的 exactPackageSpecifier 对含 "/" 的子路径返回 undefined，直接静默
# 不发现。所以这一行用 dsh-mistake-book（不是 /tools 子路径）；它只挂「建复习会话」路由
# 与客户端面板，工具仍由上面两条预设按作用域各自挂 /tools，别在根上重复注册一份。
- insert:
    - id: mistake-book-panel
      name: 'dsh-mistake-book'
      config:
        url: 'http://127.0.0.1:8000'

- insert:
    - id: preset-mistake-review
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mistake-review
        name: 错题复习
        description: 用本地错题本取出到期错题、出变式题、判分并回写 FSRS 复习计划
        order: 40
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是错题本复习教练（复习模式）。按 '<REPO>/dsh-plugin/skills/review' 的指示走复习闭环：
                取到期错题 → 让学生先作答 → 出变式题（用 mb_review 的 variant_question 存进库）
                → 判分并记录断点 step → 回写 FSRS。
                学生答完之前不要看正确答案与解析（mb_get 默认不给，判分时才传 reveal: true）。
                不写讲义、不一次讲完，一题一题来。

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - '<REPO>/dsh-plugin/skills/review'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: mistake-book-tools
            name: 'dsh-mistake-book/tools'
            config:
              url: 'http://127.0.0.1:8000'

    - id: preset-mistake-qa
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mistake-qa
        name: 错题答疑
        description: 就着一道错题就地答疑，短、停在原地，不展开成课程
        order: 41
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是错题本的就地答疑（答疑模式）。按 '<REPO>/dsh-plugin/skills/qa' 的指示答：
                短、停在原地（指根因与正误对比，不写成讲义），不派角色、不安排课程。
                问题超出这一道题时明说「这值得单独讲」，让用户回复习模式。

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - '<REPO>/dsh-plugin/skills/qa'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: mistake-book-tools
            name: 'dsh-mistake-book/tools'
            config:
              url: 'http://127.0.0.1:8000'
